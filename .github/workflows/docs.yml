name: Documentación I-CASE

on:
  pull_request:
    paths: ['docs/**', 'scripts/docs/**', 'mkdocs.yml', 'requirements-docs.txt', 'icase-backend/src/routes/**', 'icase-backend/src/infrastructure/prompts/**', '.github/workflows/docs.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/docs/**', 'mkdocs.yml', 'requirements-docs.txt', 'icase-backend/src/routes/**', 'icase-backend/src/infrastructure/prompts/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: python scripts/docs/sync_prompts.py --check
      - run: python scripts/docs/validate_docs.py
      - run: python -m mkdocs build --strict
      - run: python scripts/docs/validate_docs.py --site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
